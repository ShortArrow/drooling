[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Button-free flash. First flash still needs the BOOTSEL button.
# Windows: two-step reboot+load script (picotool rejects single-shot
# forced commands for RP2040 on Windows).
runner = "./tools/flash.cmd"
# Linux/macOS: single-shot forced load works; use this runner instead:
# runner = "picotool load -f -x -t elf"
rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv6m-none-eabi"
