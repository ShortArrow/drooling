name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            host-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install flip-link
        run: cargo install flip-link
      - name: Build library and demo (RP2040, thumbv6m)
        run: cargo build --release --example demo_rp2040 --features rp2040 --target thumbv6m-none-eabi
      - name: Build library and demo (RP2350, thumbv8m)
        run: cargo build --release --example demo_rp2350 --features rp2350 --target thumbv8m.main-none-eabihf
      # Explicit host target keeps these host-only even if a default build target returns.
      - name: Host tests (descriptor structure, rp2040)
        run: cargo test --lib --features rp2040 --target ${{ matrix.host-target }}
      - name: Host tests (descriptor structure, rp2350)
        run: cargo test --lib --features rp2350 --target ${{ matrix.host-target }}
      # No chip feature: what `cargo publish`'s verify build compiles.
      - name: Host tests (descriptor structure, no chip feature)
        run: cargo test --lib --target ${{ matrix.host-target }}

  drool:
    name: drool host tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Host tool: builds natively, no embedded targets needed.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build drool
        run: cargo build -p drool
      - name: Test drool
        run: cargo test -p drool

  docs-tandem:
    name: Bilingual docs updated together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tandem check diffs against the push base / PR base.
          fetch-depth: 0
      - name: Check .jp.md / .md pairs change together
        run: >
          bash .github/scripts/check-docs-tandem.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.sha }}"
