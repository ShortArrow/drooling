name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            host-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Install flip-link
        run: cargo install flip-link
      - name: Build library and demo (thumbv6m)
        run: cargo build --release --example demo
      # Host tests need an explicit target: .cargo/config.toml defaults the
      # build target to thumbv6m-none-eabi.
      - name: Host tests (descriptor structure)
        run: cargo test --lib --target ${{ matrix.host-target }}

  docs-tandem:
    name: Bilingual docs updated together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tandem check diffs against the push base / PR base.
          fetch-depth: 0
      - name: Check .jp.md / .md pairs change together
        run: >
          bash .github/scripts/check-docs-tandem.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.sha }}"
